# Promotes the image digest recorded by a successful Prepare release run.

name: Publish Docker image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Find successful release preparation
        id: preparation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/prepare-release.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f branch="$RELEASE_TAG" \
            -f event=push -f status=success -f per_page=100 > runs.json
          preparation=$(jq -ec --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" '
            [.[] | .workflow_runs[] | select(
              .head_sha == $sha and .head_branch == $tag and
              .event == "push" and .status == "completed" and .conclusion == "success"
            )] |
            if length == 1 then .[0]
            else error("Expected exactly one successful Prepare release run for this tag and commit")
            end
          ' runs.json)
          echo "run_id=$(jq -r '.id' <<< "$preparation")" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$(jq -r '.run_attempt' <<< "$preparation")" >> "$GITHUB_OUTPUT"
      - name: Download tested Docker image digest
        uses: actions/download-artifact@v8
        with:
          name: docker-image-digest-${{ steps.preparation.outputs.run_attempt }}
          run-id: ${{ steps.preparation.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tested-image
      # Missing or expired artifacts must fail publication; never fall back to a tag.
      - name: Read tested Docker image digest
        run: |
          digest=$(cat tested-image/docker-image-digest.txt)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Missing or invalid tested Docker image digest"
            exit 1
          fi
          echo "IMAGE=fjobswm/pathfinder@$digest" >> "$GITHUB_ENV"
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Tag image with release name
        run: docker buildx imagetools create -t "fjobswm/pathfinder:$RELEASE_TAG" "$IMAGE"
        # Only tag the image as 'latest' if its a release i.e. not a prerelease.
      - name: Tag image with 'latest'
        if: ${{ !github.event.release.prerelease }}
        run: docker buildx imagetools create -t fjobswm/pathfinder:latest "$IMAGE"

      # TODO(#3563): Remove block below and the EQLABS_* secrets once the migration window closes.
      - name: Login to Docker Hub (legacy eqlabs namespace)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.EQLABS_DOCKER_HUB_USERNAME }}
          password: ${{ secrets.EQLABS_DOCKER_HUB_ACCESS_TOKEN }}
      - name: Mirror release tag to eqlabs/pathfinder
        run: docker buildx imagetools create -t "franciszekjob/pathfinder:$RELEASE_TAG" "$IMAGE"
      - name: Mirror 'latest' to eqlabs/pathfinder
        if: ${{ !github.event.release.prerelease }}
        run: docker buildx imagetools create -t franciszekjob/pathfinder:latest "$IMAGE"

  # Dispatch the version bump workflow on pathfinder-infra
  update-infra:
    if: ${{ !github.event.release.prerelease }}
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pathfinder-infra version bump
