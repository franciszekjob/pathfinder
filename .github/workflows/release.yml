name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
    verify-release:
        name: Verify release metadata
        runs-on: ubuntu-latest
        permissions:
          contents: read
        steps:
            - uses: actions/checkout@v5
            - name: Verify tag, Cargo version, and changelog
              run: |
                set -euo pipefail

                # 1. Get the version from the git tag (e.g., v1.2.3 -> 1.2.3)
                tag_version="${GITHUB_REF_NAME#v}"

                # 2. Extract Pathfinder's version from Cargo metadata.
                if ! cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "pathfinder").version')"; then
                  echo "::error::Could not read Pathfinder version from Cargo metadata"
                  exit 1
                fi

                if [ "$tag_version" != "$cargo_version" ]; then
                  echo "::error::Tag version ($tag_version) does not match Cargo.toml version ($cargo_version)"
                  exit 1
                fi

                # 3. Check that the changelog contains an entry for the release.
                if ! grep -Fq "## [$tag_version] - " CHANGELOG.md; then
                  echo "::error::CHANGELOG.md has no release entry for $tag_version"
                  exit 1
                fi

    create-draft-release:
        needs: verify-release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: taiki-e/create-gh-release-action@v1
              with:
                # (Optional) Path to changelog.
                changelog: CHANGELOG.md
                # (Optional) Create a draft release.
                # [default value: false]
                draft: true
                # (Required) GitHub token for creating GitHub Releases.
                token: ${{ secrets.GITHUB_TOKEN }}

    upload-assets:
        needs: create-draft-release
        strategy:
            matrix:
              include:
                - target: x86_64-unknown-linux-gnu
                  os: ubuntu-22.04
                - target: aarch64-unknown-linux-gnu
                  os: ubuntu-22.04-arm
                - target: x86_64-apple-darwin
                  os: macos-latest
                - target: aarch64-apple-darwin
                  os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5
            - uses: arduino/setup-protoc@v3
              with:
                repo-token: ${{ secrets.GITHUB_TOKEN }}
            - uses: taiki-e/upload-rust-binary-action@v1
              with:
                bin: pathfinder
                target: ${{ matrix.target }}
                profile: release-lto
                token: ${{ secrets.GITHUB_TOKEN }}
